<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hip-Hop Star Catch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/deco-sparkle.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrapper">
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
      <div class="overlay-bg left-deco anim-record" style="background-image: url('assets/deco-record.svg')"></div>
      <div class="overlay-bg right-deco anim-mic" style="background-image: url('assets/deco-mic.svg')"></div>
      <div class="overlay-bg center-deco anim-sparkle-seq" style="background-image: url('assets/deco-sparkle.svg')"></div>
      <div class="overlay-bg splash-deco" style="background-image: url('assets/deco-graffiti.svg')"></div>
      <h1 class="neon-gold">HIP-HOP<br>STAR CATCH</h1>
      <p class="subtitle">Catch the bling, drop the beat!</p>
      <div class="decor-line"></div>
      <p class="hint">← → or A D — move yo' self</p>
      <p class="hint">Miss 3 = Game Over, homie!</p>
      <button id="startBtn" class="btn-gold">▶  LET'S GO!</button>
      <p class="footer-msg">press SPACE or click</p>
    </div>

    <!-- Level transition -->
    <div id="levelScreen" class="overlay hidden">
      <div class="overlay-bg left-deco anim-turntable" style="background-image: url('assets/deco-turntable.svg')"></div>
      <div class="overlay-bg right-deco anim-sparkle-lv" style="background-image: url('assets/deco-sparkle.svg')"></div>
      <h1 id="levelTitle" class="neon-gold">LEVEL UP!</h1>
      <p class="subtitle">Next level droppin'!</p>
      <div class="decor-line"></div>
      <p>Score: <span id="levelScore" class="highlight">0</span></p>
      <button id="levelContinueBtn" class="btn-gold">▶  BRING IT ON!</button>
    </div>

    <!-- Win screen -->
    <div id="winScreen" class="overlay hidden">
      <div class="overlay-bg left-deco anim-crown" style="background-image: url('assets/deco-crown.svg')"></div>
      <div class="overlay-bg right-deco anim-chain" style="background-image: url('assets/deco-chain.svg')"></div>
      <h1 class="neon-gold">YOU DA MVP!</h1>
      <p class="subtitle">Straight fire! You crushed it!</p>
      <div class="decor-line"></div>
      <p>Final Score: <span id="winScore" class="highlight">0</span></p>
      <button id="restartWinBtn" class="btn-gold">↻  PLAY AGAIN</button>
    </div>

    <!-- Lose screen -->
    <div id="loseScreen" class="overlay hidden">
      <div class="overlay-bg left-deco" style="background-image: url('assets/deco-boombox.svg')"></div>
      <div class="overlay-bg right-deco" style="background-image: url('assets/deco-graffiti.svg')"></div>
      <div class="overlay-bg skull-deco" style="background-image: url('assets/deco-chain.svg')"></div>
      <h1 class="neon-gold">GAME OVER</h1>
      <p class="subtitle">Better luck next time, playa!</p>
      <div class="decor-line"></div>
      <p>Score: <span id="loseScore" class="highlight">0</span></p>
      <button id="restartLoseBtn" class="btn-gold">↻  TRY AGAIN</button>
    </div>
  </div>

  <script src="js/player.js"></script>
  <script src="js/fallingObject.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
