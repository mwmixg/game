<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <linearGradient id="deck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a3a"/>
      <stop offset="100%" stop-color="#1a0a20"/>
    </linearGradient>
    <radialGradient id="platter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="60%" stop-color="#222"/>
      <stop offset="85%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="vlabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <!-- Deck base -->
  <rect x="10" y="30" width="220" height="150" rx="10" fill="url(#deck)" stroke="#ffd700" stroke-width="1.5"/>
  <!-- Platter -->
  <circle cx="85" cy="110" r="60" fill="url(#platter)" stroke="#444" stroke-width="1"/>
  <!-- Record grooves -->
  <g fill="none" stroke="#2a2a2a" stroke-width="0.5">
    <circle cx="85" cy="110" r="52"/><circle cx="85" cy="110" r="46"/>
    <circle cx="85" cy="110" r="40"/><circle cx="85" cy="110" r="34"/>
  </g>
  <!-- Vinyl label -->
  <circle cx="85" cy="110" r="20" fill="url(#vlabel)"/>
  <text x="85" y="108" font-family="Arial,sans-serif" font-weight="bold" font-size="5" fill="#fff" text-anchor="middle">STAR</text>
  <text x="85" y="115" font-family="Arial,sans-serif" font-weight="bold" font-size="4" fill="#fff" text-anchor="middle">CATCH</text>
  <circle cx="85" cy="110" r="3" fill="#111"/>
  <!-- Tonearm base -->
  <circle cx="195" cy="50" r="8" fill="#666" stroke="#888" stroke-width="1"/>
  <!-- Tonearm -->
  <line x1="195" y1="50" x2="130" y2="70" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="130" y1="70" x2="115" y2="95" stroke="#ccc" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="115" cy="95" r="2" fill="#ffd700"/>
  <!-- Pitch slider -->
  <rect x="170" y="100" width="5" height="40" rx="2" fill="#444"/>
  <rect x="168" y="115" width="9" height="4" rx="1" fill="#ffd700"/>
  <!-- Controls -->
  <circle cx="185" cy="160" r="5" fill="#555" stroke="#666" stroke-width="1"/>
  <rect x="200" y="155" width="12" height="10" rx="2" fill="#555"/>
  <!-- Gold trim -->
  <rect x="10" y="30" width="220" height="3" rx="1" fill="#ffd700" opacity="0.5"/>
</svg>