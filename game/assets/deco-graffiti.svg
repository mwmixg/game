<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <radialGradient id="splash1" cx="40%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff6b81" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="splash2" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="splash3" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Splash layers -->
  <ellipse cx="120" cy="90" rx="110" ry="80" fill="url(#splash1)"/>
  <ellipse cx="100" cy="80" rx="90" ry="60" fill="url(#splash2)"/>
  <ellipse cx="140" cy="100" rx="80" ry="55" fill="url(#splash3)"/>
  <!-- Drip droplets -->
  <g fill="#ff6b81" opacity="0.6">
    <ellipse cx="50" cy="60" rx="8" ry="5" transform="rotate(-20 50 60)"/>
    <ellipse cx="180" cy="50" rx="6" ry="4" transform="rotate(15 180 50)"/>
    <ellipse cx="160" cy="140" rx="7" ry="4.5" transform="rotate(-10 160 140)"/>
    <ellipse cx="70" cy="130" rx="5" ry="3.5" transform="rotate(25 70 130)"/>
  </g>
  <!-- Graffiti splatter dots -->
  <g fill="#ffd700" opacity="0.5">
    <circle cx="80" cy="45" r="3"/><circle cx="85" cy="40" r="2"/>
    <circle cx="170" cy="55" r="3.5"/><circle cx="175" cy="50" r="2"/>
    <circle cx="65" cy="120" r="2.5"/><circle cx="60" cy="125" r="1.5"/>
  </g>
  <g fill="#00d4ff" opacity="0.4">
    <circle cx="140" cy="45" r="2.5"/><circle cx="135" cy="40" r="1.5"/>
    <circle cx="50" cy="90" r="3"/><circle cx="45" cy="85" r="1.5"/>
    <circle cx="185" cy="110" r="2"/><circle cx="190" cy="105" r="1.5"/>
  </g>
  <!-- Star burst -->
  <g fill="#fff" opacity="0.3">
    <polygon points="120,30 122,36 128,36 123,40 125,46 120,42 115,46 117,40 112,36 118,36"/>
    <polygon points="200,130 201,133 204,133 202,135 203,138 200,136 197,138 198,135 196,133 199,133" transform="scale(0.7) translate(85,55)"/>
  </g>
</svg>