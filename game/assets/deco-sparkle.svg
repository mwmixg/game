<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Glow circle -->
  <circle cx="80" cy="80" r="70" fill="url(#glow)"/>
  <!-- 4-point star -->
  <g fill="#ffd700">
    <polygon points="80,10 85,70 140,80 85,90 80,150 75,90 20,80 75,70" opacity="0.9"/>
  </g>
  <!-- Inner sparkle -->
  <g fill="#fff" opacity="0.5">
    <polygon points="80,35 83,73 118,80 83,87 80,125 77,87 42,80 77,73"/>
  </g>
  <!-- Small dots -->
  <g fill="#ffd700" opacity="0.6">
    <circle cx="45" cy="40" r="2.5"/>
    <circle cx="115" cy="35" r="2"/>
    <circle cx="35" cy="105" r="2"/>
    <circle cx="125" cy="110" r="2.5"/>
    <circle cx="60" cy="25" r="1.5"/>
    <circle cx="100" cy="130" r="1.5"/>
  </g>
  <!-- Small sparkles -->
  <g fill="#fff" opacity="0.4">
    <polygon points="45,38 46,42 50,43 46,44 45,48 44,44 40,43 44,42"/>
    <polygon points="115,33 116,37 120,38 116,39 115,43 114,39 110,38 114,37"/>
    <polygon points="125,108 126,112 130,113 126,114 125,118 124,114 120,113 124,112"/>
  </g>
  <!-- Diamond shape overlay -->
  <polygon points="80,12 83,70 140,80 83,90 80,148 77,90 20,80 77,70" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>
</svg>