<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 250" width="120" height="250">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="30%" stop-color="#ddd"/>
      <stop offset="50%" stop-color="#fff"/>
      <stop offset="70%" stop-color="#ccc"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <radialGradient id="grill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="40%" stop-color="#444"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>
  <!-- Head -->
  <circle cx="60" cy="45" r="38" fill="url(#silver)" stroke="#333" stroke-width="1.5"/>
  <circle cx="60" cy="45" r="38" fill="url(#grill)" opacity="0.5"/>
  <!-- Grill lines -->
  <g stroke="#222" stroke-width="1.2" opacity="0.4">
    <line x1="28" y1="30" x2="92" y2="30"/><line x1="25" y1="38" x2="95" y2="38"/>
    <line x1="24" y1="46" x2="96" y2="46"/><line x1="25" y1="54" x2="95" y2="54"/>
    <line x1="28" y1="62" x2="92" y2="62"/>
  </g>
  <!-- Neck -->
  <rect x="50" y="80" width="20" height="20" rx="3" fill="url(#body)"/>
  <!-- Body -->
  <path d="M35 100 L85 100 L80 190 L40 190 Z" fill="url(#body)" stroke="#111" stroke-width="1"/>
  <!-- Ring -->
  <rect x="38" y="95" width="44" height="6" rx="2" fill="#ffd700" stroke="#8b6508" stroke-width="0.5"/>
  <!-- Grip lines -->
  <g stroke="#444" stroke-width="0.8">
    <line x1="42" y1="115" x2="78" y2="115"/>
    <line x1="42" y1="130" x2="78" y2="130"/>
    <line x1="42" y1="145" x2="78" y2="145"/>
    <line x1="42" y1="160" x2="78" y2="160"/>
  </g>
  <!-- Mic stand bottom -->
  <rect x="48" y="190" width="24" height="8" rx="2" fill="#ffd700" stroke="#8b6508" stroke-width="0.5"/>
  <!-- Shine -->
  <ellipse cx="50" cy="35" rx="8" ry="18" fill="#fff" opacity="0.08" transform="rotate(-15 50 35)"/>
</svg>